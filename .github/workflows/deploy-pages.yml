name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio site
        run: |
          mkdir -p _site/Images _site/certeficate
          cp index.html style.css script.js thank-you.html _site/
          cp Images/*.png Images/*.jpg Images/*.jpeg _site/Images/
          cp "Images/my resume.pdf" Images/12595758_3840_2160_30fps.mp4 _site/Images/
          cp certeficate/*.png _site/certeficate/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
